 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Pref Admin</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="" type="image/x-icon">
</head>
<body>

    <div id="darkenedSite"></div>

    <div id="header">
        <h2 id="headerTitle">This is the header</h2>
        <button id="selectEventButton">Events</button>
        <button id="newSlotButton">New Slot</button>
        <button id="usersOfEventButton">Users</button>
        <button id="userButton"></button>
    </div>

    <div id="adminPanel"></div>

    <template id="eventSelectorTemplate">
        <button id="createEventButton">+</button>
        <div id="eventsheaderContainer">
            <div id="eventsHeader">Select Event</div>
        </div>
        <div id="eventButtonsContainer"></div>
    </template>

    <div id="userPanel">
        <button id="logoutButton">Log out</button>
    </div>

    <template id="adminCalendarSettingsTemplate">
        <div>
            <h3>Test</h3>
        </div>
        <div>
            Event name
            <input class="inputStyle1" id="eventNameInput" type="text" value="" placeholder="Event name">
        </div>
        <div>
            start date
            <input class="inputStyle1" id="startDate" type="date" value="2024-01-01">
        </div>
        <div>   
            end date
            <input class="inputStyle1" id="endDate" type="date" value="2024-12-31">
        </div>
        <div>
            earliest start time
            <input class="inputStyle1" id="startTime" type="time" value="05:30">
        </div>
        <div>
            latest end time
            <input class="inputStyle1" id="endTime" type="time" value="10:20" >
        </div>

        <button id="submitCalendarSettingsButton">
            submit
        </button>
    </template>

    
    <template id="adminSlotCreationTemplate">
        <button id = "closeSlotCreationButton">x</button>
        <div>
            <h3>Test</h3>
        </div>
        <div>
            day
            <input class="inputStyle1" id="dayOfSlot" type="date" value="2026-06-29">
        </div>
        <div>
            start time
            <input class="inputStyle1" id="startTimeSlot" type="time" value="09:30">
        </div>
        <div>
            end time
            <input class="inputStyle1" id="endTimeSlot" type="time" value="10:20" >
        </div>
        <button id="submitSlotCreationButton">
            submit
        </button>
    </template>

    <template id="slotAndModuleEditTemplate">
        <button class="closeModulesWindow">X</button>
        <div id="adminSlotPanel">
            <div>
                day
                <input class="inputStyle1" id="dayOfSlotPanel" type="date" value="2026-06-29">
            </div>
            <div>
                start time
                <input class="inputStyle1" id="startTimeSlotPanel" type="time" value="09:30">
            </div>
            <div>
                end time
                <input class="inputStyle1" id="endTimeSlotPanel" type="time" value="10:20" >
            </div>
            <button id="addModuleButton">Add Module</button>
            <button id ="saveSlotAndModuleSettings">Save</button>
            <button id ="deleteSlotAndModules">Delete</button>
        </div>
        <div id="adminModulePanel"></div>
    </template>

    <template id="eventEditingTemplate">

        <button id="closeEventEditor">x</button>

        <div>
            <h3 id="eventEditingTitle">Test</h3>
        </div>
        <div>
            Event name
            <input class="inputStyle1" id="editEventName" type="text" value="" placeholder="Event name">
        </div>
        <div>
            start date
            <input class="inputStyle1" id="editStartDate" type="date" value="2024-01-01">
        </div>
        <div>   
            end date
            <input class="inputStyle1" id="editEndDate" type="date" value="2024-12-31">
        </div>
        <div>
            earliest start time
            <input class="inputStyle1" id="editStartTime" type="time" value="05:30">
        </div>
        <div>
            latest end time
            <input class="inputStyle1" id="editEndTime" type="time" value="10:20" >
        </div>
        <div id="eventEditorButtonsContainer">
            <button id="editEventSettingsButton">submit</button>
            <button id="deleteEventButton">delete</button>
        </div>
        
    </template>
    
    <template id="userManagementTemplate">
        <div id="userManagementPanel">
            <button id="closeUserManagementButton">x</button>

            <div id="userManagementHeader">
                <button id="addUsersButton">create users</button>
            </div>

            <div id="userListContainer">
                <div id="standardUserContainer">
                    <div id="standardUserHeader">Registeredusers</div>
                    <div id ="horizontalLine"></div>
                    <div id="standardUserList"></div>
                </div>
                <div id="tempUserContainer">
                    <div id="tempUserHeader">Unregistered users</div>
                    <div id ="horizontalLine"></div>
                    <div id="tempUserList"></div>
                </div>
            </div>
        </div>
    </template>


    <div id="mainGrid">
        <div id="weekSelectionContainer">
            <div>
                <button id="weekButtonLeft"><</button>
            </div>
            <div>
                <button id="weekButtonRight">></button>
            </div>
        </div>
        <div id="mainCalendar">
            <div id="calendarMonth">
                <div></div>
            </div>
            <div id="calendarDateRow">
                <div class="calendarDaySlot"></div>
                <div class="calendarDaySlot"></div>
                <div class="calendarDaySlot"></div>
                <div class="calendarDaySlot"></div>
                <div class="calendarDaySlot"></div>
                <div class="calendarDaySlot"></div>
                <div class="calendarDaySlot"></div>
            </div>
            <div id="calendarTimeColumn">

            </div>
            <div id="calendarColumns">
                <div class="calendarColumn"></div>  
                <div class="calendarColumn"></div>
                <div class="calendarColumn"></div>
                <div class="calendarColumn"></div>
                <div class="calendarColumn"></div>
                <div class="calendarColumn"></div>
                <div class="calendarColumn"></div>
            </div>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
