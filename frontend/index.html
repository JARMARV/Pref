<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pref Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="" type="image/x-icon">
</head>
<body>
    <div id="header">
        <h2 id="headerTitle">this is the header</h2>
    </div>
    <div id="darkenedSite"></div>
    <div id="mainGrid">
        <div id="loginPanel">
            <div id="loginTitle">
                <h3>Login</h3>
            </div>
            <div>
                Username
                <input id="userName" class="inputStyle1" type="text" >
            </div>
            <div>
                School ID
                <input id="establishmentID" class="inputStyle1" type="text" >
            </div>
            <div>
                Password
                <input id="password" class="inputStyle1" type="password" >
            </div>
            <div id="loginButton">
                <button id="loginButton!">
                    Login
                </button>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
